[package]
name = "vsplat-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# LAZ decode (Ward 25). default-features off holder den på wasm32-unknown-unknown:
# ingen WASI, ingen rayon — kun byteorder + num-traits.
laz = { version = "0.13", default-features = false }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
